

name: Build Sayan Boxer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35 and Build Tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug-signed APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: SayanBoxer-Boxing-v2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
