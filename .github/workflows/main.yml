
name: Build Sayan Boxer APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Find Gradle project
        shell: bash
        run: |
          find . -maxdepth 3 -type f | sort

          PROJECT_SETTINGS=$(find . -name settings.gradle -type f | head -1)

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "::error::settings.gradle not found. Upload the complete Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          gradle --project-dir "$PROJECT_DIR" --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SayanBoxer-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
