name: Build Sayan Boxer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build boxing app APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          echo "Checking the uploaded repository..."
          find . -maxdepth 3 -type f | sort | head -80
          mapfile -t projects < <(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' | sort)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error::settings.gradle was not found. Extract the project ZIP and upload ALL files inside it, not the ZIP file."
            exit 1
          fi
          if [ "${#projects[@]}" -gt 1 ]; then
            echo "::error::More than one settings.gradle found. Keep a single Sayan Boxer Android project in this repository."
            printf '%s\n' "${projects[@]}"
            exit 1
          fi
          project_dir="$(dirname "${projects[0]}")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          test -f "$project_dir/app/build.gradle" -o -f "$project_dir/app/build.gradle.kts" || {
            echo "::error::Missing app/build.gradle. Upload the complete Android project."
            exit 1
          }
          echo "Android project located in: $project_dir"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            echo "::error::Android SDK platform 35 is missing on this runner."
            exit 1
          fi
          if [ ! -f "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            echo "::error::Android Build Tools 35.0.0 are missing on this runner."
            exit 1
          fi
          echo "Android SDK ready (API 35)."

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed debug APK
        shell: bash
        run: gradle --project-dir "$PROJECT_DIR" --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SayanBoxer-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
